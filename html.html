<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outbox · Pages</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e3e6ea;--ink:#1f2328;--muted:#6b7280;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:16px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);height:52px}
header .brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:16px;color:var(--ink);text-decoration:none;white-space:nowrap}
header .brand .logo{width:20px;height:20px;flex-shrink:0}
header nav{display:flex;gap:2px}
header nav a{color:var(--muted);text-decoration:none;font-size:13px;padding:4px 10px;border-radius:6px;white-space:nowrap}
header nav a small{font-size:11px;opacity:.7;margin-left:3px}
header nav a.on{background:var(--bg);color:var(--ink);font-weight:600}
#q{flex:0 1 360px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;font:inherit}
main{display:grid;grid-template-columns:var(--side,380px) 6px 1fr;height:calc(100vh - 52px)}
#split{cursor:col-resize;background:var(--line);margin-left:-3px;width:6px;position:relative;z-index:5;transition:background .15s}
#split:hover,#split.drag{background:var(--blue)}
body.resizing{cursor:col-resize;user-select:none}
body.resizing iframe{pointer-events:none}
#list{overflow:auto;border-right:1px solid var(--line);background:var(--card)}
.row{display:flex;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:#f2f6ff}.row.sel{background:#e8efff;box-shadow:inset 3px 0 var(--blue)}
.grow{flex:1;min-width:0}.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desc,.dir{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.desc{color:#444;margin-top:1px}.dir{color:#999}
.when{color:var(--muted);font-size:11px;flex-shrink:0;text-align:right;width:64px;line-height:1.5}
.tag{font-size:10px;padding:1px 5px;border-radius:4px;margin-left:5px;font-weight:500;vertical-align:1px}
.new{background:#fef3c7;color:#92400e}.wt{background:#ede9fe;color:#5b21b6}.seen{opacity:.6}
#viewer{overflow:hidden;display:flex;flex-direction:column;padding:0 20px 12px;min-width:0}
.empty{color:var(--muted);text-align:center;margin-top:30vh}
.vhead{padding:14px 0 10px;flex-shrink:0}
.vtitle{display:flex;gap:8px;align-items:center}.vtitle h2{font-size:17px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button,a.btn{flex-shrink:0;padding:5px 11px;border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:6px;cursor:pointer;font:inherit;font-size:13px;text-decoration:none}
button.ghost{background:var(--card);color:var(--blue)}
.vsub{color:var(--muted);font-size:12px;margin-top:3px}
.frame{flex:1;min-height:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
iframe{width:100%;height:100%;border:0;display:block;background:#fff}
</style>
</head>
<body>
<header><a class="brand" href="/"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><g fill="#D97757"><rect x="10.9" y="2.0" width="2.2" height="10.0" rx="1.1" transform="rotate(0 12 12)"/><rect x="10.9" y="3.8" width="2.2" height="8.2" rx="1.1" transform="rotate(30 12 12)"/><rect x="10.9" y="2.6" width="2.2" height="9.4" rx="1.1" transform="rotate(60 12 12)"/><rect x="10.9" y="4.4" width="2.2" height="7.6" rx="1.1" transform="rotate(90 12 12)"/><rect x="10.9" y="2.0" width="2.2" height="10.0" rx="1.1" transform="rotate(120 12 12)"/><rect x="10.9" y="3.4" width="2.2" height="8.6" rx="1.1" transform="rotate(150 12 12)"/><rect x="10.9" y="3.0" width="2.2" height="9.0" rx="1.1" transform="rotate(180 12 12)"/><rect x="10.9" y="4.2" width="2.2" height="7.8" rx="1.1" transform="rotate(210 12 12)"/><rect x="10.9" y="2.2" width="2.2" height="9.8" rx="1.1" transform="rotate(240 12 12)"/><rect x="10.9" y="3.6" width="2.2" height="8.4" rx="1.1" transform="rotate(270 12 12)"/><rect x="10.9" y="2.8" width="2.2" height="9.2" rx="1.1" transform="rotate(300 12 12)"/><rect x="10.9" y="4.6" width="2.2" height="7.4" rx="1.1" transform="rotate(330 12 12)"/></g></svg><span>Outbox</span></a><nav><a href="/">Queries<small>.sql</small></a><a href="/xlsx">Sheets<small>.xlsx · .csv</small></a><a class="on" href="/html">Pages<small>.html</small></a></nav><input id="q" placeholder="search all pages, any age"></header>
<main>
  <div id="list"><div class="empty" style="margin-top:20vh">Loading…</div></div>
  <div id="split" title="drag to resize · double-click to reset"></div>
  <div id="viewer"><div class="empty">Click a page to see it here.</div></div>
</main>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = t => { const s = Date.now()/1000 - t;
  return s < 60 ? 'just now' : s < 3600 ? Math.floor(s/60)+' min ago' : s < 86400 ? Math.floor(s/3600)+' h ago' : Math.floor(s/86400)+' d ago'; };
const size = b => b > 1e6 ? (b/1e6).toFixed(1)+' MB' : Math.max(1, Math.round(b/1e3))+' KB';
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
// /view/ path: each folder segment encoded, slashes kept, so the page's relative links resolve
const viewUrl = p => '/view/' + p.split('/').map(encodeURIComponent).join('/');

let files = [], current = null;

async function load() {
  const q = $('#q').value.trim();
  files = await (await fetch('/api/html/list' + (q ? '?q=' + encodeURIComponent(q) : ''))).json();
  $('#list').dataset.q = q;
  drawList();
  if (current) {  // the open page was rewritten: reload the frame
    const f = files.find(f => f.path === current.path);
    if (f && f.mtime !== current.mtime) open(f);
  }
}
function drawList() {
  const list = $('#list');
  list.innerHTML = files.length ? '' : `<div class="empty" style="margin-top:20vh">${list.dataset.q ? 'Nothing matches “' + esc(list.dataset.q) + '”.' : 'Nothing saved in the last few days.'}</div>`;
  for (const f of files) {
    const parts = f.path.split('/'), name = parts.pop();
    const row = document.createElement('div');
    row.className = 'row' + (current && current.path === f.path ? ' sel' : '') + (store.get('seen:' + f.path + ':' + f.mtime) ? ' seen' : '');
    row.innerHTML = `<div class="grow"><div class="name"></div><div class="desc"></div><div class="dir"></div></div><div class="when"></div>`;
    const nm = $('.name', row); nm.textContent = name;
    if (Date.now()/1000 - f.mtime < 900) nm.insertAdjacentHTML('beforeend', '<span class="tag new">new</span>');
    if (f.worktree) nm.insertAdjacentHTML('beforeend', `<span class="tag wt">${esc(f.worktree)}</span>`);
    $('.desc', row).textContent = f.desc;
    $('.dir', row).textContent = (f.worktree ? parts.slice(3) : parts).join('/');
    $('.when', row).innerHTML = `${ago(f.mtime)}<br>${size(f.size)}`;
    row.onclick = () => open(f);
    list.appendChild(row);
  }
}
function open(f) {
  current = { ...f };
  store.set('seen:' + f.path + ':' + f.mtime, 1);
  location.hash = 'p=' + encodeURIComponent(f.path);
  drawList();
  const url = viewUrl(f.path) + '?v=' + Math.round(f.mtime);
  $('#viewer').innerHTML = `<div class="vhead"><div class="vtitle"><h2>${esc(f.desc || f.path.split('/').pop())}</h2>
      <button class="ghost" id="reveal">Show in Finder</button><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open in new tab</a></div>
    <div class="vsub">${esc(f.path)} · saved ${ago(f.mtime)} · ${size(f.size || 0)}</div></div>
    <div class="frame"><iframe src="${esc(url)}" sandbox="allow-scripts allow-popups allow-forms allow-modals allow-downloads allow-popups-to-escape-sandbox"></iframe></div>`;
  $('#reveal').onclick = () => fetch('/api/xlsx/reveal?p=' + encodeURIComponent(f.path), { method: 'POST', headers: { 'X-Inbox': '1' } });
}

// the search box asks the server, which searches every file of any age (the default list is the last few days)
let searchTimer;
$('#q').oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(load, 200); };
(async () => {
  await load();
  const p = new URLSearchParams(location.hash.slice(1)).get('p');
  if (p) open(files.find(f => f.path === p) || { path: p, mtime: 0, desc: '', size: 0 });
  setInterval(load, 10000);
})();
// drag the bar between the list and the viewer to resize the list; double-click resets it. Width is remembered.
(() => {
  const split = document.getElementById('split'), root = document.documentElement;
  const set = w => root.style.setProperty('--side', Math.max(220, Math.min(w, window.innerWidth - 420)) + 'px');
  try { const w = +localStorage.getItem('sideWidth'); if (w) set(w); } catch {}
  split.addEventListener('pointerdown', e => {
    split.setPointerCapture(e.pointerId); split.classList.add('drag'); document.body.classList.add('resizing');
    const move = ev => set(ev.clientX);
    const up = () => {
      split.removeEventListener('pointermove', move); split.classList.remove('drag'); document.body.classList.remove('resizing');
      try { localStorage.setItem('sideWidth', parseInt(getComputedStyle(root).getPropertyValue('--side'))); } catch {}
    };
    split.addEventListener('pointermove', move);
    split.addEventListener('pointerup', up, { once: true });
  });
  split.addEventListener('dblclick', () => { root.style.removeProperty('--side'); try { localStorage.removeItem('sideWidth'); } catch {} });
})();
</script>
</body>
</html>
